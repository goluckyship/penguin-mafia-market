name: PenguinMafiaMarket
version: 1.43.0
main: net.penguinmafia.market.PenguinMafiaMarket
api-version: '1.21'
author: PenguinMafia
description: Player-run Black Market with a real /bm GUI and Frozen Coin currency.

commands:
  home:
    description: Open your homes menu (18 slots).
    usage: /home
  sethome:
    description: Save your location as your next available home.
    usage: /sethome
  delhome:
    description: Delete one of your homes.
    usage: /delhome <number>
  homeimport:
    description: Staff - import homes from another homes plugin (e.g. DonutHomes) into /home.
    usage: /homeimport [plugin folder name]
    permission: penguinmafia.homes.import
    permission-message: You don't have permission to use /homeimport.
  home:
    description: Open your homes menu (18 slots).
    usage: /home
  sethome:
    description: Save your location as your next available home.
    usage: /sethome
  delhome:
    description: Delete one of your homes.
    usage: /delhome <number>
  guiedit:
    description: Edit the /info menu and /shop catalog/prices in game.
    usage: |
      /guiedit editor info|shop - visual mouse editor
      /guiedit help - list every editing subcommand
    permission: penguinmafia.guiedit
    permission-message: You don't have permission to use /guiedit.
  bm:
    description: Open or manage the Penguin Mafia Black Market.
    usage: |
      /bm - open the market (search, sort by price, and category filters - all remembered for you)
      /bm sell <price> - list the item in your hand
      /bm list - manage your own listings in a UI, cancel with a click
      /bm cancel <id> - cancel one of your listings (chat-based alternative)
      /bm balance - check your Frozen Coin balance
      /bm deposit - deposit held Frozen Coin items into your balance
      /bm withdraw <amount> - withdraw balance as physical Frozen Coin items
      /bm history [player] - recent completed sales (another player's requires penguinmafia.bm.history.others)
      /bm admin <wipe|refund|setprice> <id> [price] - listing fixes, requires penguinmafia.bm.admin
      /bm restock - force an extra restock round early, requires penguinmafia.bm.restock
      /bm top - the top 10 highest-earning sellers
    aliases: [blackmarket, market]
  coins:
    description: Op-only - directly add or remove a player's Frozen Coin balance, no item or renaming needed.
    usage: |
      /coins <amount> - add (or, if negative, remove) coins for yourself
      /coins <player> <amount> - add/remove coins for another player
    permission: penguinmafia.coins
    permission-message: You don't have permission to use /coins.
  bal:
    description: Check your own or another player's Frozen Coin balance.
    usage: |
      /bal - your own balance
      /bal <player> - another player's balance (not private info)
    aliases: [balance]
  pay:
    description: Send some of your Frozen Coin balance to another player.
    usage: /pay <player> <amount>
  coinflip:
    description: Bet Frozen Coins on a 50/50 coin flip - win doubles your bet, lose forfeits it.
    usage: /coinflip <amount>
    aliases: [flip, gamble]
  pa:
    description: Manage Penguin Announcements, a looping broadcast message rotation.
    usage: |
      /pa add <message> - add a message to the loop (& color codes supported)
        Clickable link: [[display text=>https://url]]
      /pa remove <#> - remove a message (see /pa list for numbers)
      /pa list - show all messages and current settings
      /pa interval <seconds> - change loop speed (default 300 = 5 min)
      /pa test [#] - broadcast a message right now, no waiting for the timer
      /pa on|off - toggle the broadcaster
    aliases: [penguinannounce, announcements]
  ptr:
    description: Manage passive playtime Frozen Coin rewards (every online player gets paid periodically).
    usage: |
      /ptr status - show current settings
      /ptr interval <minutes> - how often the payout fires (default 20)
      /ptr amount <coins> - how many coins each payout gives (default 5)
      /ptr on|off - toggle it
    aliases: [playtimereward, coinreward]
  frozenrealm:
    description: Travel to the Frozen Realm, a custom dimension with the custom Frozen Wastes biome.
    usage: |
      /frozenrealm - teleport there
      /frozenrealm back - return to the Overworld
      /frozenrealm cabin - requires penguinmafia.frozenrealm.cabin, teleport straight to the nearest cabin
      /frozenrealm scramble - requires penguinmafia.frozenrealm.scramble, re-rolls where future cabins/bridges spawn (persists across restarts; wipe the dimension's chunk data and restart for a fully fresh scrambled layout)
    aliases: [fr, frozen]
  sandbox:
    description: Op-only - a superflat world for testing/building, separate from the survival world.
    usage: |
      /sandbox - teleport there (ops only)
      /sandbox back - return to the Overworld
    aliases: [sb]
    permission: penguinmafia.sandbox
    permission-message: You don't have permission to use /sandbox.
  autodeposit:
    description: Toggle automatic depositing of Frozen Coins you pick up straight into your balance.
    usage: |
      /autodeposit - turn Auto-Deposit on or off. While it's on, Frozen Coins that land in your
      inventory are swept into your balance automatically, and /bm withdraw is blocked until you
      turn it back off.
    aliases: [ad]
  afk:
    description: Op-only - AFK Farm mode. Keeps chunks loaded, auto-collects Frozen Coins into your balance (even offline), and mails you anything else collected.
    usage: |
      /afk [radius] - start an AFK Farm here (default 3x3 chunks, or 0-3 for a custom radius)
        Force-loads the area, vacuums dropped Frozen Coins straight into your balance every
        second (works even while you're disconnected), and holds any other item picked up in
        a mailbox delivered next time you join. Pair with /gen to have something to collect.
      /afk - with no args while one is running, stops your AFK Farm from anywhere
    permission: penguinmafia.afk
    permission-message: You don't have permission to use /afk.
  gen:
    description: Op-only - drop a standing item generator that spawns items (including real Frozen Coins) on a timer.
    usage: |
      /gen <item> <delay-secs> <amount> - start a generator at your feet (one per player at a time)
        <item> can be a material id (diamond, iron_ingot, ...) or "coin" for real Frozen Coins
      /gen - with no args, stops your own active generator from anywhere
    permission: penguinmafia.gen
    permission-message: You don't have permission to use /gen.
  chat:
    description: Toggle whether Auto-Deposit and AFK Farm print a message every time they credit your balance.
    usage: |
      /chat - turn balance-update chat messages on or off (check /bal instead when they're off)
  shop:
    description: Open the Shop GUI to spend your Frozen Coin balance on building and decoration blocks (not ores, netherite, or anything rare - see /bm for that).
    usage: |
      /shop - opens a paged catalog GUI. Hover an item to see its price,
      left-click to buy a stack, right-click for more quantity options.
  baltop:
    description: See the top 10 Frozen Coin balances on the server.
    usage: /baltop - top 10 balances
    aliases: [bt]
  info:
    description: Reopen the how-to-play menu that's shown automatically when you join.
    usage: /info - opens the command guide menu
  job:
    description: Join a job (Miner, Farmer, Lumberjack, Hunter, Fisherman) to earn Frozen Coins for normal survival actions.
    usage: |
      /job - see your own job levels and progress
      /job list - see every job and what it pays for
      /job join <job> - join a job (only one at a time)
      /job leave <job> - leave a job (resets its progress)
      /job stats [player] - check your or someone else's job levels
      /job top <job> - the top 10 players in a job
  auction:
    description: The Auction House - list an item for timed bidding instead of a fixed Black Market price.
    usage: |
      /auction - see your own running auctions
      /auction sell <price> <minutes> - auction the item in your hand (5-4320 minutes)
      /auction list - see every active auction
      /auction info <id> - details on one auction
      /auction bid <id> <amount> - place a bid (each bid must beat the last by 5%)
      /auction cancel <id> - cancel your own auction before it has any bids (penguinmafia.auction.forcecancel can force-cancel one with a bid)
      /auction history [player] - past completed auctions
    aliases: [ah]
  mod:
    description: Op-only moderation toolbox - freeze, mute, warn, and warning history.
    usage: |
      /mod freeze <player> - lock a player in place with a lightning strike, a black screen, and a FROZEN title (lifts automatically on disconnect)
      /mod unfreeze <player> - let them move again
      /mod mute <player> <minutes> [reason] - block their chat for a while
      /mod unmute <player> - lift a mute early
      /mod warn <player> <reason> - add a permanent warning to their record
      /mod tempban <player> <minutes> [reason] - ban them, auto-lifted after the time's up
      /mod unban <player> - lift a tempban early
      /mod history <player> - see everyone's warnings for a player (numbered)
      /mod unwarn <player> <#> - remove a specific warning by its number
      /mod list - see who's currently frozen, muted, or tempbanned
    permission: penguinmafia.mod
    permission-message: You don't have permission to use /mod.
    aliases: [staff]
  bounty:
    description: Put Frozen Coins on another player's head, collected automatically by whoever kills them in PvP.
    usage: |
      /bounty - see the current top bounties
      /bounty place <player> <amount> - put coins on someone's head (stacks with existing bounties)
      /bounty check <player> - see a player's bounty and who contributed
      /bounty list - same as no args, the top 10 bounties
  warehouse:
    description: Paid personal storage - start with one free row, spend Frozen Coins to add more (up to 6 rows).
    usage: |
      /warehouse - open your personal storage
      /warehouse info - see your current size and next upgrade cost
      /warehouse upgrade - spend coins to add another row
    aliases: [wh]
  daily:
    description: Claim a once-per-day Frozen Coin login bonus that grows with a consecutive-day streak.
    usage: |
      /daily - claim today's reward (streak resets if you miss a day)
      /daily top - see the longest active daily streaks
  aura:
    description: A purely cosmetic particle ring that follows you around. Locked to one specific player.
    usage: |
      /aura - toggle the default aura on/off
      /aura <particle> - turn it on with a specific particle (e.g. end_rod, heart, flame, witch, portal)
      /aura <color> [color2] [color3] ... - a custom-colored ring (e.g. "/aura red black"),
      cycling through each named color around the ring
      /aura devil - black devil horns plus full red-and-black demonic wings running down to your lower body (no flame particle)
      /aura om - a dark storm cloud hovering over your head
      /aura off - turn it off

# Every staff-only action checks one of these nodes with Bukkit's own
# hasPermission(), not op status directly - "default: op" means an op has
# every node below automatically, with nothing to configure, exactly like
# before. A permissions plugin (LuckPerms, etc.) can grant any individual
# node here to a non-op rank (a "Mod" group, say) to hand out just that one
# power without making the whole rank a server op. /bm, /frozenrealm, and
# /auction mix public and staff-only subcommands under one command, so
# their staff nodes aren't tied to the command itself in the commands:
# section above - they're only listed and checked here.
permissions:
  penguinmafia.mod:
    description: Use /mod (freeze, mute, warn, tempban, and their history/list/undo commands).
    default: op
  penguinmafia.coins:
    description: Use /coins to directly add or remove any player's Frozen Coin balance.
    default: op
  penguinmafia.sandbox:
    description: Use /sandbox (teleport to the superflat testing world).
    default: op
  penguinmafia.afk:
    description: Use /afk (start/stop an AFK Farm that collects coins automatically).
    default: op
  penguinmafia.gen:
    description: Use /gen (place a standing item/coin generator).
    default: op
  penguinmafia.frozenrealm.scramble:
    description: Use /frozenrealm scramble (re-roll future Frozen Realm structure locations).
    default: op
  penguinmafia.frozenrealm.cabin:
    description: Use /frozenrealm cabin (teleport straight to the nearest cabin).
    default: op
  penguinmafia.bm.restock:
    description: Use /bm restock to force an extra Black Market Dealer restock round early.
    default: op
  penguinmafia.bm.admin:
    description: Use /bm admin (wipe, refund, or setprice on any listing) and receive the automatic underpriced-listing alerts.
    default: op
  penguinmafia.bm.history.others:
    description: Use /bm history <player> to check someone else's sales history (your own never needs this).
    default: op
  penguinmafia.auction.forcecancel:
    description: Force-cancel another player's auction even after it already has a bid.
    default: op
  penguinmafia.guiedit:
    description: Use /guiedit (edit the /info menu and /shop items and prices in game).
    default: op
  penguinmafia.homes.import:
    description: Use /homeimport to copy homes from another homes plugin.
    default: op
