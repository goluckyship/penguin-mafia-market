name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and inspect
        id: build
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== mvn package ==="
            mvn -B package --file pom.xml
            echo "PACKAGE_EXIT_CODE=$?"

            echo "=== dependency tree ==="
            mvn -B dependency:tree --file pom.xml

            JAR=$(find ~/.m2 -iname "paper-api*.jar" ! -iname "*sources*" ! -iname "*javadoc*" | head -n 1)
            echo "=== resolved jar: $JAR ==="

            echo "=== does it contain the specific classes we need? ==="
            unzip -l "$JAR" | grep -F "org/bukkit/entity/Player.class"
            unzip -l "$JAR" | grep -F "org/bukkit/ChatColor.class"
            unzip -l "$JAR" | grep -F "org/bukkit/plugin/java/JavaPlugin.class"
            unzip -l "$JAR" | grep -F "org/bukkit/Bukkit.class"
            echo "=== total org/bukkit/ entries ==="
            unzip -l "$JAR" | grep -c "org/bukkit/"
            echo "=== sample of org/bukkit top-level dirs ==="
            unzip -l "$JAR" | grep -oE "org/bukkit/[a-zA-Z_]+/" | sort -u | head -n 40
          } > full.log 2>&1
          tail -n 100 full.log
          test -f target/PenguinMafiaMarket.jar

      - name: Post log as an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -c 55000 full.log 2>/dev/null || echo "no log produced")
          jq -n --arg body "$LOG" --arg outcome "${{ steps.build.outcome }}" '{title:("Build log (" + $outcome + ")"), body: ("```\n" + $body + "\n```")}' > /tmp/issue.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload built jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PenguinMafiaMarket
          path: target/PenguinMafiaMarket.jar
