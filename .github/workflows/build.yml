name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        id: build
        continue-on-error: true
        run: mvn -B package --file pom.xml > build.log 2>&1

      - name: Show tail of log
        if: always()
        run: tail -n 150 build.log || true

      - name: Post failure log as an issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -A 3 "\[ERROR\]" build.log | head -c 40000 || echo "no [ERROR] lines found")
          jq -n --arg errors "$ERRORS" '{title:"Build failure log", body: ("```\n" + $errors + "\n```")}' > /tmp/issue.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload built jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PenguinMafiaMarket
          path: target/PenguinMafiaMarket.jar

      - name: Commit compiled jar to repo
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp target/PenguinMafiaMarket.jar dist/PenguinMafiaMarket.jar
          git config user.email "bot@penguinmafia.local"
          git config user.name "Penguin Mafia Bot"
          git add dist/PenguinMafiaMarket.jar
          if git diff --staged --quiet; then
            echo "No change to commit"
          else
            git commit -m "Update compiled plugin jar [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
          fi
