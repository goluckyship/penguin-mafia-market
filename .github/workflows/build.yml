name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: List available Paper API versions
        run: |
          curl -sS "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml" > paper-versions.xml || true
          echo "--- Paper API versions ---"
          cat paper-versions.xml || true

      - name: Build with Maven
        id: build
        continue-on-error: true
        run: mvn -B package --file pom.xml > build.log 2>&1

      - name: Show tail of log always
        if: always()
        run: tail -n 200 build.log || true

      - name: Post failure log as an issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -c 55000 build.log)
          VERSIONS=$(cat paper-versions.xml 2>/dev/null | tail -c 4000)
          jq -n --arg body "$LOG" --arg versions "$VERSIONS" '{title:"Build failure log", body: ("Available Paper API versions:\n```\n" + $versions + "\n```\n\nBuild log:\n```\n" + $body + "\n```")}' > /tmp/issue.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload built jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PenguinMafiaMarket
          path: target/PenguinMafiaMarket.jar
