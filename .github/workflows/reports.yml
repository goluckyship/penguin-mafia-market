name: Generate Vanilla Reports

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download matching Paper server jar and generate reports
        id: gen
        continue-on-error: true
        run: |
          set -e
          curl -sS -o paper-server.jar "https://fill-data.papermc.io/v1/objects/b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083/paper-26.2-129.jar"
          ls -la paper-server.jar
          java -DbundlerMainClass=net.minecraft.data.Main -jar paper-server.jar --reports > reports.log 2>&1
          find generated -iname "overworld.json" -path "*multi_noise*"

      - name: Commit generated overworld biome parameters
        id: commit
        if: steps.gen.outcome == 'success'
        run: |
          {
            mkdir -p tools/vanilla-reports
            FOUND=$(find generated -iname "overworld.json" -path "*multi_noise*" | head -n 1)
            echo "found file: $FOUND"
            cp "$FOUND" tools/vanilla-reports/overworld.json
            git config user.email "bot@penguinmafia.local"
            git config user.name "Penguin Mafia Bot"
            git add tools/vanilla-reports/overworld.json
            git status
            if git diff --staged --quiet; then
              echo "No change"
            else
              git commit -m "Add vanilla overworld biome parameters [skip ci]"
              for i in 1 2 3 4 5; do
                git pull --rebase origin main && git push origin main && break
                echo "push attempt $i failed, retrying..."
                sleep 5
              done
            fi
          } > commit.log 2>&1
          cat commit.log

      - name: Post commit log as an issue always
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -c 30000 commit.log 2>/dev/null || echo "no commit.log produced")
          jq -n --arg body "$LOG" '{title:"Reports commit log", body: ("```\n" + $body + "\n```")}' > /tmp/issue2.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue2.json

      - name: Post log as an issue if it failed
        if: steps.gen.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -c 50000 reports.log 2>/dev/null || echo "no log")
          jq -n --arg body "$LOG" '{title:"Reports generation failed", body: ("```\n" + $body + "\n```")}' > /tmp/issue.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d @/tmp/issue.json
